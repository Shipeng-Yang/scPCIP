# scPCIP predict config. Seed: embryo, endosperm, seed coat. Trained on Arabidopsis, soybean and rice.
# The gene -> orthogroup map is fetched automatically (see `scpcip fetch`).
dictionary: ../dictionaries/seed.yaml
aggregate: sum
method: weighted_rank
seed: 20261006
score_correction: bg_center
warn_mapping_rate_below: 0.5
refine: selftrain_vote
vote_resolution: 2.0
vote_min_purity: 0.5
tissue_system:
  embryo: embryo
  endosperm: endosperm
  seed_coat: seed_coat
tissue_system_reliability: 'the three seed cell types are the three seed compartments; per-cell confidence is in expected_accuracy'
