# scPCIP predict config. Root: 8 coarse lineage types (epidermis, cortex, endodermis, pericycle, phloem, procambium, xylem, root cap) and a meristem state score. Trained on 31 datasets of 9 species.
# The gene -> orthogroup map is fetched automatically (see `scpcip fetch`).
dictionary: ../dictionaries/root.yaml
aggregate: sum
method: weighted_rank
seed: 20261002
score_correction: bg_center
warn_mapping_rate_below: 0.5
refine: selftrain_vote
vote_resolution: 2.0
vote_min_purity: 0.5
tissue_system:
  epidermis: dermal
  cortex: ground
  endodermis: ground
  pericycle: vascular
  phloem: vascular
  procambium: vascular
  xylem: vascular
  root_cap: root_cap
tissue_system_reliability: 'tissue systems group the cell types (dermal: epidermis; ground: cortex, endodermis; vascular: pericycle, phloem, procambium, xylem; root cap); per-cell confidence is in expected_accuracy'
