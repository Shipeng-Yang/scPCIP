# scPCIP predict config. Flower: pollen, stamen, carpel, perianth, non-floral. All training species are Brassicaceae.
# The gene -> orthogroup map is fetched automatically (see `scpcip fetch`).
dictionary: ../dictionaries/flower.yaml
aggregate: sum
method: weighted_rank
seed: 20261006
score_correction: bg_center
warn_mapping_rate_below: 0.5
refine: selftrain_vote
vote_resolution: 2.0
vote_min_purity: 0.5
tissue_system:
  perianth: perianth
  stamen: stamen
  pollen: stamen
  carpel: carpel
  non_floral: non_floral
tissue_system_reliability: 'tissue systems are the floral organs (pollen is grouped with stamen); per-cell confidence is in expected_accuracy'
